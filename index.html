<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>眠りの音 — Sleep Sound Generator</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;background:linear-gradient(135deg,#080818 0%,#0d1b2a 60%,#0a1020 100%);color:#d8e8f4;font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden}
    #stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
    .wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:2rem 1rem 3rem}
    h1{text-align:center;font-size:2rem;font-weight:300;letter-spacing:.12em;color:#a8d8ea}
    .subtitle{text-align:center;color:#3e6680;font-size:.85rem;margin-top:.4rem;margin-bottom:1.8rem}

    .master{display:flex;align-items:center;gap:1.2rem;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:1rem 1.4rem;margin-bottom:1rem}
    .play-btn{width:52px;height:52px;border-radius:50%;border:2px solid #4fc3f7;background:rgba(79,195,247,.13);color:#4fc3f7;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
    .play-btn:hover{background:rgba(79,195,247,.28);transform:scale(1.06)}
    .play-btn.on{box-shadow:0 0 18px rgba(79,195,247,.45)}
    .vol-wrap{flex:1;display:flex;flex-direction:column;gap:.35rem}
    .vol-wrap label{font-size:.72rem;color:#3e6680;text-transform:uppercase;letter-spacing:.07em}
    #vizCanvas{border-radius:8px;background:rgba(0,0,0,.25);flex-shrink:0}

    .presets{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.2rem}
    .preset-btn{font-size:.8rem;padding:.4rem .9rem;border-radius:20px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#8ab4cc;cursor:pointer;transition:.2s;white-space:nowrap}
    .preset-btn:hover{background:rgba(255,255,255,.1);color:#cde}
    .preset-btn.active{border-color:#4fc3f7;color:#4fc3f7;background:rgba(79,195,247,.12)}

    .timer-row{display:flex;align-items:center;gap:.5rem;margin-bottom:1.5rem;font-size:.78rem;color:#3e6680;flex-wrap:wrap}
    .timer-btn{padding:.3rem .7rem;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#6a8fa8;cursor:pointer;font-size:.75rem;transition:.2s}
    .timer-btn:hover{background:rgba(255,255,255,.08)}
    .timer-btn.active{border-color:#4fc3f7;color:#4fc3f7;background:rgba(79,195,247,.1)}
    #timerDisplay{color:#4fc3f7;font-variant-numeric:tabular-nums}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
    .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:1.2rem;transition:border-color .3s,background .3s}
    .card.on{border-color:var(--ac);background:rgba(255,255,255,.065)}
    .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
    .card-title{display:flex;align-items:center;gap:.55rem;font-size:.92rem;font-weight:500}
    .card-icon{font-size:1.25rem}
    .card-desc{margin-top:.6rem;font-size:.7rem;color:#2e5060}

    .tog{position:relative;width:44px;height:24px;flex-shrink:0}
    .tog input{opacity:0;width:0;height:0}
    .tog-sl{position:absolute;inset:0;background:rgba(255,255,255,.1);border-radius:12px;cursor:pointer;transition:background .2s}
    .tog-sl::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s;opacity:.6}
    .tog input:checked+.tog-sl{background:var(--ac)}
    .tog input:checked+.tog-sl::before{transform:translateX(20px);opacity:1}

    .param{margin-bottom:.75rem}
    .param-lbl{display:flex;justify-content:space-between;font-size:.73rem;color:#3e6680;margin-bottom:.3rem}
    .param-val{color:var(--ac);font-weight:500}
    input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:rgba(255,255,255,.1);border-radius:2px;outline:none;cursor:pointer}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--ac,#4fc3f7);cursor:pointer;box-shadow:0 0 5px var(--ac,#4fc3f7)}
    .master input[type=range]{--ac:#4fc3f7}

    footer{text-align:center;margin-top:2rem;color:#1e3040;font-size:.75rem}
  </style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <h1>🌙 眠りの音</h1>
  <p class="subtitle">Sleep Sound Generator</p>

  <div class="master">
    <button class="play-btn" id="playBtn">▶</button>
    <div class="vol-wrap">
      <label>マスター音量</label>
      <input type="range" id="masterVol" min="0" max="100" value="70">
    </div>
    <canvas id="vizCanvas" width="180" height="44"></canvas>
  </div>

  <div class="presets" id="presets"></div>

  <div class="timer-row">
    <span>タイマー：</span>
    <button class="timer-btn active" data-min="0">なし</button>
    <button class="timer-btn" data-min="15">15分</button>
    <button class="timer-btn" data-min="30">30分</button>
    <button class="timer-btn" data-min="60">60分</button>
    <button class="timer-btn" data-min="90">90分</button>
    <span id="timerDisplay"></span>
  </div>

  <div class="grid" id="grid"></div>
  <footer>ヘッドフォン推奨（バイノーラルビート使用時）</footer>
</div>

<script>
// ── Module definitions ───────────────────────────────────────────────────────
const MODS = [
  { id:'binaural', icon:'🧠', name:'バイノーラルビート', desc:'脳波を睡眠周波数へ誘導', ac:'#9c6cf7',
    params:[
      {id:'baseFreq', lbl:'ベース周波数',         min:80,  max:400, val:200, unit:'Hz'},
      {id:'beatFreq', lbl:'ビート周波数 (Delta推奨:2Hz)', min:0.5, max:8,   val:2,   step:.1, unit:'Hz'},
      {id:'vol',      lbl:'音量',                 min:0,   max:100, val:60,  unit:'%'},
    ]},
  { id:'rain',  icon:'🌧️', name:'雨音',       desc:'ポツポツ降る雨のしずく', ac:'#4fc3f7', noise:'rain',
    params:[
      {id:'intensity', lbl:'雨の強さ',        min:0,   max:100,  val:65,  unit:'%'},
      {id:'highpass',  lbl:'音の細かさ',       min:100, max:3000, val:400, unit:'Hz'},
    ]},
  { id:'ocean', icon:'🌊', name:'波音',       desc:'寄せては返す波のリズム', ac:'#26c6da', noise:'brown',
    params:[
      {id:'speed', lbl:'波の速さ', min:.03, max:.5, val:.1, step:.01, unit:'Hz'},
      {id:'vol',   lbl:'音量',    min:0,   max:100, val:60,            unit:'%'},
    ]},
  { id:'fire',  icon:'🔥', name:'焚き火',     desc:'炎のはぜる音',          ac:'#ff8a50', noise:'fire',
    params:[
      {id:'vol',     lbl:'音量',               min:0,   max:100,  val:50,  unit:'%'},
      {id:'lowpass', lbl:'温かさ（ローパス）', min:150, max:2500, val:700, unit:'Hz'},
    ]},
  { id:'white', icon:'🌫️', name:'ホワイトノイズ', desc:'全周波数均等・雑音マスキング', ac:'#b0bec5', noise:'white',
    params:[{id:'vol', lbl:'音量', min:0, max:100, val:35, unit:'%'}]},
  { id:'pink',  icon:'💜', name:'ピンクノイズ',   desc:'自然界に最も近いノイズ',         ac:'#f48fb1', noise:'pink',
    params:[{id:'vol', lbl:'音量', min:0, max:100, val:40, unit:'%'}]},
  { id:'brown', icon:'🟤', name:'ブラウンノイズ', desc:'低周波・重厚な滝のような音',     ac:'#a1887f', noise:'brown',
    params:[{id:'vol', lbl:'音量', min:0, max:100, val:40, unit:'%'}]},
  { id:'solfeggio', icon:'✨', name:'ソルフェジオ', desc:'周波数が自動で上下するドローン', ac:'#ffd54f',
    params:[
      {id:'freq',       lbl:'中心周波数',       min:174, max:963, val:528,  unit:'Hz'},
      {id:'vibratoD',   lbl:'揺らぎ幅',         min:1,   max:60,  val:18,   unit:'Hz'},
      {id:'vibratoSpd', lbl:'揺らぎ速さ',       min:.02, max:.5,  val:.08,  step:.01, unit:'Hz'},
      {id:'vol',        lbl:'音量',             min:0,   max:100, val:30,   unit:'%'},
    ]},
];

const PRESETS = [
  {id:'sleep',    name:'🌙 深い眠り',  mods:{binaural:{beatFreq:2,  vol:28},  brown:{vol:55}}},
  {id:'meditate', name:'🧘 瞑想',      mods:{binaural:{beatFreq:4.5,vol:32},  solfeggio:{freq:528,vol:22}, pink:{vol:20}}},
  {id:'rain',     name:'🌧️ 雨の夜',   mods:{rain:{intensity:70, highpass:700}, brown:{vol:30}}},
  {id:'campfire', name:'🔥 焚き火',   mods:{fire:{vol:55, lowpass:700}, brown:{vol:22}}},
  {id:'ocean',    name:'🌊 海辺',      mods:{ocean:{vol:65, speed:.1}, pink:{vol:18}}},
];

// ── Audio state ──────────────────────────────────────────────────────────────
let ctx = null, masterGain = null, analyser = null;
let noiseBufs = null;
let playing = false;
const active = {}, params = {}, nodes = {};
let timerCountHandle = null, timerSec = 0;

MODS.forEach(d => {
  active[d.id] = false;
  params[d.id] = {};
  d.params.forEach(p => { params[d.id][p.id] = p.val; });
});

// ── Noise buffer generation ──────────────────────────────────────────────────
function generateNoiseBuffers() {
  const sr = ctx.sampleRate;
  const LEN = sr * 20; // 20-second looping buffers

  // White noise
  const wBuf = ctx.createBuffer(1, LEN, sr);
  const wd = wBuf.getChannelData(0);
  for (let i = 0; i < LEN; i++) wd[i] = Math.random() * 2 - 1;

  // Pink noise (Paul Kellet algorithm)
  const pBuf = ctx.createBuffer(1, LEN, sr);
  const pd = pBuf.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for (let i = 0; i < LEN; i++) {
    const w = Math.random() * 2 - 1;
    b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759;
    b2=.96900*b2+w*.1538520; b3=.86650*b3+w*.3104856;
    b4=.55000*b4+w*.5329522; b5=-.7616*b5-w*.0168980;
    pd[i] = (b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;
    b6 = w * .115926;
  }

  // Brown noise
  const brBuf = ctx.createBuffer(1, LEN, sr);
  const brd = brBuf.getChannelData(0);
  let lo = 0;
  for (let i = 0; i < LEN; i++) {
    const w = Math.random() * 2 - 1;
    lo = (lo + .02 * w) / 1.02;
    brd[i] = lo * 3.5;
  }

  // Fire: brown base + prominent crackles with clustering
  const fBuf = ctx.createBuffer(1, LEN, sr);
  const fd = fBuf.getChannelData(0);
  lo = 0;
  let nextCrackle = Math.floor(sr * (Math.random() * .3 + .05));
  for (let i = 0; i < LEN; i++) {
    const w = Math.random() * 2 - 1;
    lo = (lo + .02 * w) / 1.02;
    fd[i] = lo * 2.0;
    if (i >= nextCrackle) {
      // Sharp crack: short burst with fast decay
      const crackLen = Math.floor(sr * (Math.random() * .012 + .003));
      const crackAmp = Math.random() * .7 + .25;
      for (let j = 0; j < crackLen && i + j < LEN; j++) {
        fd[i + j] += (Math.random() * 2 - 1) * crackAmp * Math.exp(-j / (crackLen * .3));
      }
      // Occasionally cluster 2-3 rapid cracks
      if (Math.random() < .35) {
        const extra = Math.floor(sr * (Math.random() * .04 + .01));
        nextCrackle = i + extra;
      } else {
        nextCrackle = i + Math.floor(sr * (Math.random() * .6 + .08));
      }
    }
    fd[i] = Math.max(-1, Math.min(1, fd[i]));
  }

  // Rain: soft ambient base + individual drip impulses
  const rainBuf = ctx.createBuffer(1, LEN, sr);
  const rnd = rainBuf.getChannelData(0);
  b0=b1=b2=b3=b4=b5=b6=0;
  for (let i = 0; i < LEN; i++) {
    const w = Math.random() * 2 - 1;
    b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759;
    b2=.96900*b2+w*.1538520; b3=.86650*b3+w*.3104856;
    b4=.55000*b4+w*.5329522; b5=-.7616*b5-w*.0168980;
    rnd[i] = (b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11 * .25;
    b6 = w * .115926;
  }
  let dropPos = 0;
  while (dropPos < LEN) {
    const amp   = Math.random() * .55 + .15;
    const decay = Math.floor(sr * (Math.random() * .018 + .004));
    for (let j = 0; j < decay * 4 && dropPos + j < LEN; j++) {
      rnd[dropPos + j] += (Math.random() * 2 - 1) * amp * Math.exp(-j / decay);
    }
    dropPos += Math.floor(sr * (Math.random() * .12 + .025));
  }

  return { white: wBuf, pink: pBuf, brown: brBuf, fire: fBuf, rain: rainBuf };
}

function mkNoiseSource(bufKey) {
  const src = ctx.createBufferSource();
  src.buffer = noiseBufs[bufKey];
  src.loop = true;
  src.loopStart = 0;
  src.loopEnd = noiseBufs[bufKey].duration;
  // Randomize start position so simultaneous sources don't phase-cancel
  src.loopStart = 0;
  src.start(0, Math.random() * noiseBufs[bufKey].duration);
  return src;
}

// ── Audio init (同期) ────────────────────────────────────────────────────────
function getOrCreateCtx() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = ctx.createGain();
    masterGain.gain.value = document.getElementById('masterVol').value / 100;
    analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    masterGain.connect(analyser);
    analyser.connect(ctx.destination);
    noiseBufs = generateNoiseBuffers();
  }
  if (ctx.state === 'suspended') ctx.resume();
}

// ── Module start ─────────────────────────────────────────────────────────────
function startMod(def) {
  if (nodes[def.id]) return;
  const p = params[def.id];
  let n = {};

  if (def.id === 'binaural') {
    const g = ctx.createGain();
    g.gain.value = (p.vol || 60) / 100 * .5;
    g.connect(masterGain);
    const oL = ctx.createOscillator(); oL.type = 'sine';
    oL.frequency.value = p.baseFreq || 200;
    const pL = ctx.createStereoPanner(); pL.pan.value = -1;
    oL.connect(pL); pL.connect(g); oL.start();
    const oR = ctx.createOscillator(); oR.type = 'sine';
    oR.frequency.value = (p.baseFreq || 200) + (p.beatFreq || 2);
    const pR = ctx.createStereoPanner(); pR.pan.value = 1;
    oR.connect(pR); pR.connect(g); oR.start();
    n = { oL, oR, pL, pR, g };

  } else if (def.id === 'solfeggio') {
    const g = ctx.createGain();
    g.gain.value = (p.vol || 30) / 100 * .16;
    g.connect(masterGain);
    const o1 = ctx.createOscillator(); o1.type = 'sine';
    o1.frequency.value = p.freq || 528;
    const o2 = ctx.createOscillator(); o2.type = 'sine';
    o2.frequency.value = (p.freq || 528) * 2;
    const hg = ctx.createGain(); hg.gain.value = .18;
    // LFO for automatic frequency sweep
    const vLFO = ctx.createOscillator(); vLFO.type = 'sine';
    vLFO.frequency.value = p.vibratoSpd || .08;
    const vDepth1 = ctx.createGain(); vDepth1.gain.value = p.vibratoD || 18;
    const vDepth2 = ctx.createGain(); vDepth2.gain.value = (p.vibratoD || 18) * 2;
    vLFO.connect(vDepth1); vDepth1.connect(o1.frequency);
    vLFO.connect(vDepth2); vDepth2.connect(o2.frequency);
    vLFO.start();
    o1.connect(g); o1.start();
    o2.connect(hg); hg.connect(g); o2.start();
    n = { o1, o2, hg, g, vLFO, vDepth1, vDepth2 };

  } else if (def.id === 'ocean') {
    const src = mkNoiseSource('brown');
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = 450; bp.Q.value = .6;
    // LFO for wave motion
    const lfoG = ctx.createGain(); lfoG.gain.value = .5;
    const lfo = ctx.createOscillator(); lfo.type = 'sine';
    lfo.frequency.value = p.speed || .1;
    const lfoD = ctx.createGain(); lfoD.gain.value = .45;
    const vG = ctx.createGain(); vG.gain.value = (p.vol || 60) / 100;
    src.connect(bp); bp.connect(lfoG); lfoG.connect(vG); vG.connect(masterGain);
    lfo.connect(lfoD); lfoD.connect(lfoG.gain); lfo.start();
    n = { src, bp, lfo, lfoD, lfoG, vG };

  } else if (def.id === 'rain') {
    const src = mkNoiseSource('rain');
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass';
    hp.frequency.value = p.highpass || 400;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.value = 12000;
    const g = ctx.createGain(); g.gain.value = (p.intensity || 65) / 100;
    src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(masterGain);
    n = { src, hp, lp, g };

  } else if (def.id === 'fire') {
    const src = mkNoiseSource('fire');
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.value = p.lowpass || 700;
    // LFO でめらめら揺らぎ
    const lfoG = ctx.createGain(); lfoG.gain.value = .65;
    const lfo  = ctx.createOscillator(); lfo.type = 'sine';
    lfo.frequency.value = .7 + Math.random() * .4; // 0.7-1.1Hz
    const lfoD = ctx.createGain(); lfoD.gain.value = .28;
    lfo.connect(lfoD); lfoD.connect(lfoG.gain); lfo.start();
    const g = ctx.createGain(); g.gain.value = (p.vol || 50) / 100;
    src.connect(lp); lp.connect(lfoG); lfoG.connect(g); g.connect(masterGain);
    n = { src, lp, lfoG, lfo, lfoD, g };

  } else {
    // white / pink / brown
    const src = mkNoiseSource(def.noise);
    const g = ctx.createGain(); g.gain.value = (p.vol || 40) / 100;
    src.connect(g); g.connect(masterGain);
    n = { src, g };
  }

  nodes[def.id] = n;
}

// ── Module stop ──────────────────────────────────────────────────────────────
function stopMod(def) {
  const n = nodes[def.id]; if (!n) return;
  ['oL','oR','o1','o2','lfo','vLFO','src'].forEach(k => {
    if (n[k]) { try { n[k].stop(0); } catch(e) {} }
  });
  Object.values(n).forEach(x => { if (x && x.disconnect) try { x.disconnect(); } catch(e) {} });
  delete nodes[def.id];
}

// ── Param update ─────────────────────────────────────────────────────────────
function updateParam(defId, paramId, val) {
  params[defId][paramId] = val;
  const n = nodes[defId]; if (!n || !active[defId]) return;
  const t = ctx.currentTime;
  if (defId === 'binaural') {
    const p = params[defId], base = p.baseFreq||200, beat = p.beatFreq||2;
    if (n.oL) n.oL.frequency.setTargetAtTime(base,       t, .1);
    if (n.oR) n.oR.frequency.setTargetAtTime(base + beat, t, .1);
    if (paramId === 'vol' && n.g) n.g.gain.setTargetAtTime(val/100*.5, t, .05);
  } else if (defId === 'solfeggio') {
    if (paramId === 'freq') {
      if (n.o1) n.o1.frequency.setTargetAtTime(val,   t, .2);
      if (n.o2) n.o2.frequency.setTargetAtTime(val*2, t, .2);
    }
    if (paramId === 'vibratoD') {
      if (n.vDepth1) n.vDepth1.gain.setTargetAtTime(val,   t, .1);
      if (n.vDepth2) n.vDepth2.gain.setTargetAtTime(val*2, t, .1);
    }
    if (paramId === 'vibratoSpd' && n.vLFO) n.vLFO.frequency.setTargetAtTime(val, t, .1);
    if (paramId === 'vol' && n.g) n.g.gain.setTargetAtTime(val/100*.16, t, .05);
  } else if (defId === 'ocean') {
    if (paramId === 'speed' && n.lfo) n.lfo.frequency.setTargetAtTime(val, t, .5);
    if (paramId === 'vol'   && n.vG)  n.vG.gain.setTargetAtTime(val/100,  t, .05);
  } else if (defId === 'rain') {
    if (paramId === 'highpass'  && n.hp) n.hp.frequency.setTargetAtTime(val,    t, .1);
    if (paramId === 'intensity' && n.g)  n.g.gain.setTargetAtTime(val/100, t, .05);
  } else if (defId === 'fire') {
    if (paramId === 'lowpass' && n.lp) n.lp.frequency.setTargetAtTime(val, t, .1);
    if (paramId === 'vol'     && n.g)  n.g.gain.setTargetAtTime(val/100,  t, .05);
  } else {
    if (paramId === 'vol' && n.g) n.g.gain.setTargetAtTime(val/100, t, .05);
  }
}

// ── Ensure playing (同期) ────────────────────────────────────────────────────
function ensurePlaying() {
  getOrCreateCtx();
  if (!playing) {
    playing = true;
    document.getElementById('playBtn').textContent = '⏸';
    document.getElementById('playBtn').classList.add('on');
  }
}

function checkAllOff() {
  if (!Object.values(active).some(v => v)) {
    playing = false;
    document.getElementById('playBtn').textContent = '▶';
    document.getElementById('playBtn').classList.remove('on');
  }
}

// ── Timer ────────────────────────────────────────────────────────────────────
function setTimer(min) {
  clearInterval(timerCountHandle);
  document.getElementById('timerDisplay').textContent = '';
  document.querySelectorAll('.timer-btn').forEach(b => b.classList.toggle('active', +b.dataset.min === min));
  if (min === 0) return;
  timerSec = min * 60;
  timerCountHandle = setInterval(() => {
    timerSec--;
    const m = Math.floor(timerSec / 60), s = timerSec % 60;
    document.getElementById('timerDisplay').textContent = `残り ${m}:${String(s).padStart(2,'0')}`;
    if (timerSec <= 30 && masterGain && ctx)
      masterGain.gain.linearRampToValueAtTime(0, ctx.currentTime + timerSec);
    if (timerSec <= 0) {
      clearInterval(timerCountHandle);
      MODS.forEach(d => { if (active[d.id]) { stopMod(d); active[d.id] = false; syncCard(d); } });
      playing = false;
      document.getElementById('playBtn').textContent = '▶';
      document.getElementById('playBtn').classList.remove('on');
      document.getElementById('timerDisplay').textContent = '';
      if (masterGain) masterGain.gain.value = document.getElementById('masterVol').value / 100;
    }
  }, 1000);
}

// ── UI helpers ───────────────────────────────────────────────────────────────
function fmt(p, v) {
  if (p.unit === '%')  return `${Math.round(v)}%`;
  if (p.unit.includes('Hz')) return `${parseFloat(v).toFixed(p.step && p.step < 1 ? 2 : 0)} Hz`;
  return v;
}
function syncCard(def) {
  document.getElementById(`card-${def.id}`)?.classList.toggle('on', active[def.id]);
  const tog = document.getElementById(`tog-${def.id}`);
  if (tog) tog.checked = active[def.id];
}
function buildCard(def) {
  const card = document.createElement('div');
  card.className = 'card'; card.id = `card-${def.id}`;
  card.style.setProperty('--ac', def.ac);

  const head = document.createElement('div'); head.className = 'card-head';
  const title = document.createElement('div'); title.className = 'card-title';
  title.innerHTML = `<span class="card-icon">${def.icon}</span><span>${def.name}</span>`;
  const tog = document.createElement('label'); tog.className = 'tog';
  const inp = document.createElement('input'); inp.type = 'checkbox'; inp.id = `tog-${def.id}`;
  const sl  = document.createElement('span'); sl.className = 'tog-sl';
  tog.append(inp, sl);
  inp.addEventListener('change', () => {
    active[def.id] = inp.checked;
    syncCard(def);
    if (inp.checked) {
      ensurePlaying();
      startMod(def);
    } else {
      stopMod(def);
      checkAllOff();
    }
  });
  head.append(title, tog); card.append(head);

  def.params.forEach(p => {
    const row = document.createElement('div'); row.className = 'param';
    const lbl = document.createElement('div'); lbl.className = 'param-lbl';
    const lt = document.createElement('span'); lt.textContent = p.lbl;
    const vt = document.createElement('span'); vt.className = 'param-val';
    vt.id = `v-${def.id}-${p.id}`; vt.textContent = fmt(p, p.val);
    lbl.append(lt, vt);
    const range = document.createElement('input'); range.type = 'range';
    range.min = p.min; range.max = p.max; range.value = p.val;
    range.id = `r-${def.id}-${p.id}`;
    if (p.step) range.step = p.step;
    range.style.setProperty('--ac', def.ac);
    range.addEventListener('input', () => {
      const v = parseFloat(range.value);
      vt.textContent = fmt(p, v);
      updateParam(def.id, p.id, v);
    });
    row.append(lbl, range); card.append(row);
  });

  if (def.desc) {
    const d = document.createElement('div'); d.className = 'card-desc'; d.textContent = def.desc;
    card.append(d);
  }
  return card;
}

function applyPreset(preset) {
  ensurePlaying();
  MODS.forEach(d => { stopMod(d); active[d.id] = false; syncCard(d); });
  for (const [mid, overrides] of Object.entries(preset.mods)) {
    const def = MODS.find(d => d.id === mid); if (!def) continue;
    Object.entries(overrides).forEach(([k, v]) => {
      params[mid][k] = v;
      const r  = document.getElementById(`r-${mid}-${k}`);
      const vt = document.getElementById(`v-${mid}-${k}`);
      const pd = def.params.find(pp => pp.id === k);
      if (r)  r.value = v;
      if (vt && pd) vt.textContent = fmt(pd, v);
    });
    active[mid] = true; syncCard(def); startMod(def);
  }
  document.querySelectorAll('.preset-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.id === preset.id));
}

// ── Master play button ───────────────────────────────────────────────────────
document.getElementById('playBtn').addEventListener('click', () => {
  getOrCreateCtx();
  if (playing) {
    MODS.forEach(d => { if (active[d.id]) stopMod(d); });
    ctx.suspend();
    playing = false;
    document.getElementById('playBtn').textContent = '▶';
    document.getElementById('playBtn').classList.remove('on');
  } else {
    playing = true;
    document.getElementById('playBtn').textContent = '⏸';
    document.getElementById('playBtn').classList.add('on');
    for (const d of MODS) { if (active[d.id]) startMod(d); }
  }
});

document.getElementById('masterVol').addEventListener('input', e => {
  if (masterGain && ctx) masterGain.gain.setTargetAtTime(e.target.value / 100, ctx.currentTime, .05);
});

// ── Stars background ─────────────────────────────────────────────────────────
(function () {
  const cv = document.getElementById('stars');
  const cx = cv.getContext('2d');
  cv.width = window.innerWidth; cv.height = window.innerHeight;
  const stars = Array.from({length:160}, () => ({
    x: Math.random() * cv.width, y: Math.random() * cv.height,
    r: Math.random() * 1.4 + .3,
    a: Math.random() * .6 + .1,
    sp: Math.random() * .015 + .004,
    ph: Math.random() * Math.PI * 2,
  }));
  let t = 0;
  (function draw() {
    cx.clearRect(0, 0, cv.width, cv.height); t += .016;
    stars.forEach(s => {
      const a = s.a * (.5 + .5 * Math.sin(t * s.sp * 60 + s.ph));
      cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      cx.fillStyle = `rgba(200,220,255,${a})`; cx.fill();
    });
    requestAnimationFrame(draw);
  })();
  window.addEventListener('resize', () => { cv.width = window.innerWidth; cv.height = window.innerHeight; });
})();

// ── Visualizer ───────────────────────────────────────────────────────────────
(function () {
  const cv = document.getElementById('vizCanvas');
  const cx = cv.getContext('2d');
  (function draw() {
    requestAnimationFrame(draw);
    cx.clearRect(0, 0, cv.width, cv.height);
    if (!analyser || !playing) {
      cx.strokeStyle = 'rgba(79,195,247,.25)'; cx.lineWidth = 1;
      cx.beginPath(); cx.moveTo(0, cv.height/2); cx.lineTo(cv.width, cv.height/2); cx.stroke();
      return;
    }
    const buf = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteTimeDomainData(buf);
    cx.strokeStyle = '#4fc3f7'; cx.lineWidth = 1.5;
    cx.shadowColor = '#4fc3f7'; cx.shadowBlur = 5;
    cx.beginPath();
    const step = cv.width / buf.length;
    buf.forEach((v, i) => {
      const y = (v/128 - 1) * (cv.height/2) + cv.height/2;
      i ? cx.lineTo(i*step, y) : cx.moveTo(0, y);
    });
    cx.stroke(); cx.shadowBlur = 0;
  })();
})();

// ── Build UI ─────────────────────────────────────────────────────────────────
const grid = document.getElementById('grid');
MODS.forEach(d => grid.appendChild(buildCard(d)));

const presetsEl = document.getElementById('presets');
PRESETS.forEach(p => {
  const btn = document.createElement('button');
  btn.className = 'preset-btn'; btn.dataset.id = p.id; btn.textContent = p.name;
  btn.addEventListener('click', () => applyPreset(p));
  presetsEl.appendChild(btn);
});

document.querySelectorAll('.timer-btn').forEach(b => {
  b.addEventListener('click', () => setTimer(+b.dataset.min));
});
</script>
