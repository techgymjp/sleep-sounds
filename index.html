<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080818">
  <title>眠りの音 — Sleep Sound Generator</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <h1 id="appTitle">🌙 眠りの音</h1>
  <p class="subtitle">Sleep Sound Generator</p>

  <div class="master">
    <button class="play-btn" id="playBtn" aria-label="play">▶</button>
    <div class="vol-wrap">
      <label id="masterLbl">マスター音量</label>
      <input type="range" id="masterVol" min="0" max="100" value="70">
    </div>
    <canvas id="vizCanvas" width="180" height="44"></canvas>
  </div>

  <div class="presets" id="presets"></div>

  <div class="timer-row" id="timerRow">
    <span id="timerLbl">タイマー：</span>
    <span id="timerDisplay"></span>
  </div>

  <!-- アプリだけ: リワード広告を見ると、しばらく広告なし -->
  <div class="noads hidden" id="noAds">
    <button class="noads-btn" id="noAdsBtn"></button>
    <span class="noads-msg hidden" id="noAdsMsg"></span>
  </div>

  <div class="grid" id="grid"></div>
  <footer>
    <div id="footerNote">ヘッドフォン推奨（バイノーラルビート使用時）</div>
    <div class="legal">
      <span id="buildInfo"></span>
      <a id="privacyLink" href="https://techgym.jp/privacy-policy/" target="_blank" rel="noopener">プライバシーポリシー</a>
      <span id="adPrivacy" class="hidden">｜<a href="#" id="adPrivacyLink">広告の設定</a></span>
    </div>
  </footer>
</div>

<script src="js/i18n.js"></script>
<script src="js/ads-config.js"></script>
<script src="js/build-info.js"></script>
<script src="js/main.js"></script>
<script src="js/ads.js"></script>
<script src="js/app.js"></script>
</body>
</html>
